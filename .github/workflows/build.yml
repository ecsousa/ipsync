name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types: [published, edited]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo test
        run: cargo test --all-targets

  build-binaries:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: ddnsplus-linux-x64
            use-cross: false
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: ddnsplus-linux-arm64
            use-cross: true
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: ddnsplus-windows-x64.exe
            use-cross: false
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: ddnsplus-windows-arm64.exe
            use-cross: false
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            target: x86_64-apple-darwin
            name: ddnsplus-macos-x64
            use-cross: false
            rustflags: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            name: ddnsplus-macos-arm64
            use-cross: false
            rustflags: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install musl-tools (Linux x64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary
        if: matrix.use-cross == false
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary with cross
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Rename binary (Unix)
        if: matrix.os != 'windows-latest'
        run: mv target/${{ matrix.target }}/release/ddnsplus ${{ matrix.name }}

      - name: Rename binary (Windows)
        if: matrix.os == 'windows-latest'
        run: move target\${{ matrix.target }}\release\ddnsplus.exe ${{ matrix.name }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ matrix.name }}
